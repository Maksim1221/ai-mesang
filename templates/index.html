<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI Mesang - Мессенджер будущего</title>
<link rel="stylesheet" href="/static/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<!-- Auth Screen -->
<div id="authScreen" class="auth-screen">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" class="auth-logo-svg">
            <defs>
              <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#667eea"/>
                <stop offset="100%" style="stop-color:#764ba2"/>
              </linearGradient>
            </defs>
            <circle cx="60" cy="60" r="58" fill="url(#logoGrad)"/>
            <path d="M40 45 L80 45 L80 75 L40 75 Z" fill="#fff" opacity="0.9"/>
            <path d="M40 55 L70 55 L70 65 L40 65 Z" fill="#667eea"/>
            <circle cx="30" cy="85" r="5" fill="#667eea"/>
            <circle cx="50" cy="85" r="5" fill="#764ba2"/>
            <circle cx="70" cy="85" r="5" fill="#667eea"/>
            <circle cx="90" cy="85" r="5" fill="#764ba2"/>
          </svg>
        </div>
        <h1 class="auth-title">AI Mesang</h1>
        <p class="auth-subtitle">Мессенджер будущего. Общение без границ.</p>
      </div>
      
      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab">Вход</button>
        <button class="auth-tab" id="registerTab">Регистрация</button>
      </div>
      
      <div id="authError" class="auth-error"></div>
      
      <form id="authForm" class="auth-form">
        <div class="form-group" id="loginGroup">
          <label class="form-label" for="authUsername">Логин или Email</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="authUsername" placeholder="Введите логин" autocomplete="username">
          </div>
        </div>
        <div class="form-group" id="loginGroup">
          <label class="form-label" for="authPassword">Пароль</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="authPassword" placeholder="Введите пароль" autocomplete="current-password">
          </div>
        </div>
        <div class="form-group hidden" id="regGroup">
          <label class="form-label" for="authUsernameReg">Имя пользователя</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="authUsernameReg" placeholder="Придумайте имя" autocomplete="username">
          </div>
        </div>
        <div class="form-group hidden" id="regGroup">
          <label class="form-label" for="authEmailReg">Email (необязательно)</label>
          <div class="input-wrapper">
            <span class="input-icon">📧</span>
            <input type="email" id="authEmailReg" placeholder="Для восстановления" autocomplete="email">
          </div>
        </div>
        <div class="form-group hidden" id="regGroup">
          <label class="form-label" for="authPasswordReg">Пароль</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="authPasswordReg" placeholder="Минимум 6 символов" autocomplete="new-password">
          </div>
        </div>
        <button type="button" id="authLogin" class="btn-primary btn-large">Войти</button>
        <button type="button" id="authReg" class="btn-primary btn-large hidden">Создать аккаунт</button>
      </form>
      
      <div class="auth-footer">
        <p class="auth-terms">Нажимая кнопку, вы соглашаетесь с условиями использования</p>
      </div>
    </div>
  </div>
</div>

<!-- Messenger -->
<div id="msgScreen" class="messenger hidden">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="brand-small">
        <div class="brand-icon-sm">AI</div>
        <span class="brand-name">AI Mesang</span>
      </div>
      <div class="sidebar-actions">
        <button class="icon-btn" id="searchBtn" title="Найти пользователей">🔍</button>
        <button class="icon-btn" id="newChatBtn" title="Новый чат">➕</button>
      </div>
    </div>
    
    <div class="my-profile-bar">
      <div class="avatar me" id="myAvatar">U</div>
      <div class="me-info">
        <span class="me-name" id="myName">User</span>
        <span class="me-badge" id="myBadge"></span>
      </div>
      <div class="status-dot online"></div>
      <button class="icon-btn" id="profileBtn" title="Мой профиль">👤</button>
      <button class="icon-btn" id="shortsBtn" title="Шортсы">🎬</button>
      <button class="icon-btn" id="adminPanelBtn" title="Админ-панель" style="display:none">🛡️</button>
      <button class="icon-btn" id="logoutBtn" title="Выйти">🚪</button>
    </div>
    
    <div class="chat-list" id="chatList">
      <div class="empty-chats">
        <div class="empty-icon">💬</div>
        <p>Начните общение</p>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
    <div id="noChat" class="no-chat">
      <div class="no-chat-content">
        <div class="no-chat-icon">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <h3>AI Mesang</h3>
        <p>Выберите чат или создайте новый</p>
      </div>
    </div>
    
    <div id="chatView" class="hidden">
      <div class="chat-header">
        <div class="avatar sm" id="cAvatar">?</div>
        <div class="chat-header-info">
          <span class="chat-header-name" id="cTitle">Чат</span>
          <span class="chat-header-status" id="cStatus">онлайн</span>
        </div>
        <div class="chat-header-actions">
          <button class="icon-btn" title="Информация" onclick="openChatMembers()">👥</button>
          <button class="icon-btn" title="Ещё">⋮</button>
        </div>
      </div>
      
      <div class="chat-content">
        <div class="messages-container" id="msgContainer"></div>
        <div class="members-sidebar" id="membersPanel">
          <div class="members-header">
            <span>👥 Участники</span>
            <button class="close-members" onclick="closeMembers()">✕</button>
          </div>
          <div class="members-list" id="membersList"></div>
        </div>
      </div>
      
      <div class="message-input-area">
        <div class="typing-indicator" id="typingIndicator" style="display:none">
          <span id="typingText"></span>
        </div>
        <div class="media-actions">
          <button class="media-btn" id="photoBtn" title="Фото">📷</button>
          <button class="media-btn" id="fileBtn" title="Файл">📎</button>
          <button class="media-btn" id="voiceBtn" title="Голосовое">🎤</button>
          <button class="media-btn" id="videoBtn" title="Кружочек">⭕</button>
          <input type="file" id="photoInput" accept="image/*" style="display:none">
          <input type="file" id="fileInput" style="display:none">
        </div>
        <div class="input-wrapper">
          <input type="text" id="msgInput" placeholder="Написать сообщение..." autocomplete="off">
          <button id="sendBtn" class="send-btn" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
        <div class="voice-recording" id="voiceRecording" style="display:none">
          <div class="voice-wave">🎤 Запись...</div>
          <button class="voice-cancel" id="voiceCancel">✕</button>
        </div>
      </div>
    </div>
    
    <!-- Shorts Area -->
    <div id="shortsView" class="hidden">
      <div class="shorts-fullscreen">
        <div class="shorts-container" id="shortsContainer"></div>
        <div class="shorts-controls">
          <button class="shorts-btn" id="shortsPrev">◀</button>
          <div class="shorts-progress" id="shortsProgress"></div>
          <button class="shorts-btn" id="shortsNext">▶</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal" id="modalContent"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
